<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d2a">
  <meta name="description" content="Relay District, an original co-op arcade action RPG set on a closed transit line.">
  <title>Relay District</title>
</head>
<body>
  <main id="game" data-scene="plaza">
    <canvas id="view" aria-label="Relay District game view" tabindex="0"></canvas>
    <div id="labels" aria-hidden="true"></div>
    <div class="screen-glass"></div>
    <header class="topbar">
      <div class="logo">
        <svg aria-hidden="true" viewBox="0 0 44 44"><path d="M5 24h10l4-13 6 22 4-9h10M8 15a17 17 0 1 1 0 14" /></svg>
        <div><div class="title">Relay District</div><div id="location" class="location">Repair Plaza • 2007</div></div>
      </div>
      <div class="toptools">
        <span id="connection" class="connection">Connecting</span>
        <button id="companion-key" type="button">Companion</button>
        <button id="dispatch-key" type="button">Dispatch</button>
        <button id="sound-key" type="button" aria-pressed="false">Sound off</button>
      </div>
    </header>
    <aside id="objective" class="instrument objective">
      <div id="objective-title" class="objective-title">Repair Plaza</div>
      <p id="objective-line">Connecting to the district…</p>
    </aside>
    <div id="prompt" class="prompt hidden"></div>
    <div id="combo" class="combo hidden" aria-live="off"></div>
    <div id="toast" class="toast hidden" role="status"></div>
    <section id="story" class="instrument story hidden" aria-label="Story transmission">
      <div class="transmission"><span id="story-title"></span><button id="dismiss-story" aria-label="Close transmission">×</button></div>
      <p id="story-text"></p>
    </section>
    <footer class="hud">
      <section class="instrument vitals" aria-label="Player status">
        <div id="portrait" class="portrait"><img id="portrait-image" src="/models/moth-portrait.png" alt=""></div>
        <div class="vital-values">
          <div class="vital-name"><strong id="companion-name">Neri</strong><span id="form-name">Kite Moth</span></div>
          <div class="meter hp" role="meter" aria-label="Health" aria-valuemin="0" aria-valuemax="125" aria-valuenow="125"><div></div><span>125 / 125</span></div>
          <div class="meter energy" role="meter" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div></div><span>100 / 100</span></div>
        </div>
      </section>
      <section class="skills" aria-label="Combat controls">
        <button type="button" data-action="morph" class="skill jade" aria-label="Arm or recall, Q"><span>◇</span><kbd>Q</kbd></button>
        <button type="button" data-action="attack" class="skill blue" aria-label="Attack, J"><span>╱</span><kbd>J</kbd></button>
        <button type="button" data-action="skill" class="skill lilac" aria-label="Signature skill, K"><span>↟</span><kbd>K</kbd></button>
        <button type="button" data-action="mastery" class="skill amber" aria-label="Mastery follow-up, L"><span>✦</span><kbd>L</kbd></button>
      </section>
      <div class="key-hint"><b>WASD</b> Move <b>SHIFT</b> Dodge <b>SPACE</b> Jump <b>E</b> Use</div>
    </footer>
    <div id="shade" class="shade hidden">
      <section id="panel" class="panel instrument" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <header class="panel-titlebar"><h1 id="panel-title"></h1><button type="button" id="close-panel" aria-label="Close panel">×</button></header>
        <div id="panel-body"></div>
      </section>
    </div>
    <div id="loading" class="loading"><div class="boot-mark" aria-hidden="true">◇</div><strong>Relay District</strong><span id="loading-text">Opening a line to the plaza…</span></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
